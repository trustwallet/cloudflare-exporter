schemaVersion: 1
name: cloudflare-exporter
summary: |-
  Cloudflare Analytics observability — exports Cloudflare zone, colocation, Worker, and load-balancer metrics to Prometheus.

  Route here for: adding/changing Cloudflare metrics scraped from the GraphQL Analytics API; configuring which zones or metric names to expose; Helm chart for the exporter; Docker image build.

  Do NOT route here for: Prometheus/VictoriaMetrics configuration, scrape job configuration (lives in platform-gitops), Grafana dashboard authoring, or any non-Cloudflare metrics pipeline.

  Consumers: Any Prometheus/VictoriaMetrics instance scraping the /metrics endpoint; Grafana dashboards built on cloudflare_* metrics.

  Ships: A Docker container image (ghcr.io/lablabs/cloudflare_exporter) and a Helm chart (charts/cloudflare-exporter/).

  Agent routing: main.go — entry point, config, scrape loop; cloudflare.go — Cloudflare REST + GraphQL API client; prometheus.go — metric registry and analytics-to-Prometheus conversion.
